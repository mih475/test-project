name: ES Phase 3A stop economics and regime discovery
on:
  push:
    paths:
      - 'phase3a_stop_regime.py'
      - '.github/workflows/phase3a.yml'
      - 'multiyear_backtest.py'
      - 'phase2b_diagnostics.py'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run Phase 3A
        shell: bash
        run: |
          set -o pipefail
          python phase3a_stop_regime.py | tee phase3a_results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3a-results
          path: |
            phase3a_results.txt
            phase3a_enriched_trades.csv
            phase3a_random_controls.csv
            phase3a_stop_economics.csv
            phase3a_all_candidates.csv
            phase3a_top_candidates.csv
