name: ORB filter diagnostics
on:
  push:
    branches: [master]
    paths:
      - 'orb_filter_diagnostics.py'
      - '.github/workflows/orb-filter-diagnostics.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests tabulate
      - run: python orb_filter_diagnostics.py | tee orb_filter_diagnostics_log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orb-filter-diagnostics-results
          path: |
            orb_filter_diagnostics_log.txt
            orb_filter_trade_features.csv
            orb_filter_all_results.csv
            orb_filter_discovery_rank.csv
            orb_filter_selection.csv
            orb_filter_direction_diagnostic.csv
