name: Inspect ES ETH Availability
on:
  push:
    paths:
      - 'inspect_eth_availability.py'
      - '.github/workflows/inspect-eth.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - run: python inspect_eth_availability.py
